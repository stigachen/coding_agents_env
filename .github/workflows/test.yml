name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jq and python3
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            case "$(uname -s)" in
              Linux)
                sudo apt-get update
                sudo apt-get install -y jq
                ;;
              Darwin)
                brew install jq
                ;;
              MINGW*|MSYS*|CYGWIN*)
                mkdir -p "$RUNNER_TEMP/bin"
                curl -fsSL -o "$RUNNER_TEMP/bin/jq.exe" \
                  https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
                echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
                export PATH="$RUNNER_TEMP/bin:$PATH"
                ;;
              *)
                echo "do not know how to install jq on $(uname -s)" >&2
                exit 1
                ;;
            esac
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            python_path=$(command -v python)
            bindir=$(dirname "$python_path")
            cp -f "$python_path" "$bindir/python3.exe"
          fi
          jq --version
          python3 -c 'import sys; print(sys.version)'
          node --version

      - name: Run unit tests
        shell: bash
        run: python3 tests/run_all.py
